include:
  - component: $CI_SERVER_HOST/DevOps-Templates/ci-cd-devops-catalog/devops-next-comp@~latest
    inputs:
      release-comp: "false"
      sonar-enabled: "true"
      sast-enabled: "false"
      accessibility-enabled: "false"
      node-image: "$NEXUS_REGISTRY_PULL_URL/devops-common/node:24.21.0-alpine"
      build-command: "build"
      test-command: "test:ci"
      sonar-project-name: "[DADOSGOV] Frontend"
      sonar-project-key: "dadosgov-frontend"
      sonar-lcov-path: "./coverage/lcov.info"
      sonar-exclusions: "**/*tests*/**/*,**/*mock*/**/*,__fixtures__/**/*,**/language/**,**/config/**/*,*config*"
      sonar-coverage-exclusions: "**/*tests*/**/*,**/*mock*/**/*,__fixtures__/**/*,**/language/**,**/config/**/*,*config*"
      junit-report-path: "junit.xml"
      coverage-report-path: "coverage/cobertura-coverage.xml"
      buildah-image: "$BUILDAH_IMAGE"
      docker-image-name: "dadosgov/dadosgov-frontend"
      dockerfile-dev: "docker/Dockerfile"
      dockerfile-tst: "docker/Dockerfile"
      dockerfile-ppr: "docker/Dockerfile"
      dockerfile-prd: "docker/Dockerfile"
      deploy-token: ${DADOSGOV_TOKEN}
      deploy-repository: "dadosgov/dadosgov-deployment"
      deploy-manifest: "dadosgov-frontend-deployment"
      deploy-url-dev: "https://dadosgov.dev.ic.arte.lan/"
      deploy-url-tst: "https://dadosgov.tst.ic.arte.lan/"
      deploy-url-ppr: "https://dadosgov.ppr.ic.arte.lan/"
      deploy-url-prd: "https://dadosgov.prd.ic.arte.lan/"
      deployment-branch-dev: "DEV"
      deployment-branch-tst: "TST"
      deployment-branch-ppr: "PPR"
      deployment-branch-prd: "PRD"
      accessibility-url: "https://dadosgov.ppr.ic.arte.lan/"
      pa11y-url: "https://dadosgov.ppr.ic.arte.lan/"
      release-token: ${DADOSGOV_TOKEN}