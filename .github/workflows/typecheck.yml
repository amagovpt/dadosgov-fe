name: Typecheck

on:
  # Environment branches only. Feature branches are covered by the pull_request
  # trigger, so this avoids running the suite twice per PR -- both events fire on
  # every push to a branch that has one open.
  push:
    branches: [develop, tst, ppr, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript type check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit
